# Dependencies only — postgres, redis, jaeger.
#
# Use this to run the backend on your host (go run ./cmd/server) against
# containerized dependencies, instead of building the backend image:
#
#   docker compose -f docker-compose.services.yml up -d
#   cd backend && go run ./cmd/server
#
# Ports map to the backend's local config defaults (config/env.yaml).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-no_auth_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-no_auth_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jaeger v2 receives the backend's OTLP traces locally. UI on http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"

volumes:
  pgdata:
