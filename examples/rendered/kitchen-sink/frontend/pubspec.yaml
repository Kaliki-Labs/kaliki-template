name: kitchen_sink_app
description: Kitchen Sink App Flutter app
publish_to: "none"
version: 0.1.0+1
# Member of the Dart pub workspace rooted at the project root pubspec.yaml.
# `flutter create` (run post-generation) leaves an existing pubspec.yaml
# alone, so this field survives — verified empirically, not just assumed.
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^9.2.2
  go_router: ^14.0.0
  riverpod_annotation: ^4.0.7
  shared_api_client:
    path: ../packages/shared_api_client

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
