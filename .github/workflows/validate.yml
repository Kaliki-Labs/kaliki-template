name: validate

# Heavy validation of the FINAL post-task build for each profile. Manual-only —
# trigger from the Actions tab (or `gh workflow run validate.yml`) when you want
# a clean-room check, e.g. before tagging a release or after a quiet stretch to
# catch upstream rot (new Go/Flutter/dep releases). Per-PR correctness is covered
# locally (Makefile / pre-push) plus examples-drift; nothing runs on a timer.
#
# If the repo later goes active again and you want it back on a cadence, add:
#   schedule:
#     - cron: "0 3 * * 1"   # weekly, Mondays 03:00 UTC

on:
  workflow_dispatch: # manual trigger from the Actions tab

concurrency:
  group: validate
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false # nightly: see every broken profile in one run
      matrix:
        # include_frontend mirrors each profile's examples/profiles/*.yml answer,
        # known statically — lets later steps skip Flutter entirely for profiles
        # that don't need it instead of installing it unconditionally.
        include:
          - profile: minimal
            include_frontend: false
          - profile: jwt-full-otp
            include_frontend: true
          - profile: kitchen-sink
            include_frontend: true
    name: ${{ matrix.profile }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@localhost:25432/test_db?sslmode=disable
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum" # cache Go modules across runs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No npm cache here: this step runs before `copier copy` renders the
          # profile, so no package-lock.json exists in the checkout yet (unlike
          # setup-go above, setup-node errors hard on an empty glob match).
      - uses: astral-sh/setup-uv@v5
      - uses: subosito/flutter-action@v2
        if: matrix.include_frontend
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true # Blacksmith redirects actions/cache, so this persists the SDK across runs.
        # Skipped for profiles without a frontend — no need to pay for the SDK
        # download/extract on every run.

      - name: Render profile (with tasks)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install copier
          pip install pyyaml
          python3 -c "import yaml,sys; yaml.safe_dump(yaml.safe_load(open(sys.argv[1]))['answers'], open('answers.yml','w'), sort_keys=False)" \
            examples/profiles/${{ matrix.profile }}.yml
          copier copy --defaults --trust --data-file answers.yml --vcs-ref HEAD . out

      - name: Backend build + test
        working-directory: out/backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: API spec build
        working-directory: out/api
        run: |
          npm install
          npm run build:local

      # The render step above already ran copier's _tasks, which for
      # include_frontend profiles fully bootstrap the frontend + shared_api_client
      # Dart pub workspace (regenerate the API client, `flutter create`,
      # `melos bootstrap`, one `build_runner build --workspace`). Re-running that
      # bootstrap here would just redo the same work for free (build_runner
      # finding 0 outputs to generate) — only analyze/test are new. `flutter
      # analyze` run from frontend/ correctly scopes to the frontend package
      # even though it's a workspace member (verified empirically).
      - name: Frontend analyze + test
        if: matrix.include_frontend
        working-directory: out/frontend
        run: |
          flutter analyze
          if ls test/*_test.dart >/dev/null 2>&1; then flutter test; else echo "(no frontend tests — skipping flutter test)"; fi
