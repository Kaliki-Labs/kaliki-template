name: examples-drift

# Cheap per-PR gate (~1-2 min, no DB, no build). Re-renders the committed
# snapshots + regenerates the docs and fails if anything drifts from what's
# checked in. The heavy build/test matrix runs nightly (see validate.yml) and
# locally pre-push (see Makefile / .githooks/pre-push) — keeping per-PR minutes
# minimal on the free tier.

on:
  pull_request:
    paths:
      - "template/**"
      - "copier.yml"
      - "examples/**"
      - "scripts/**"

# Cancel superseded runs when a PR is pushed again — the biggest minute-saver.
concurrency:
  group: examples-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v5

      - name: Regenerate snapshots + docs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install copier
          pip install pyyaml
          bash scripts/render-examples.sh
          bash scripts/gen-example-docs.sh

      - name: Fail if anything drifted
        run: |
          if ! git diff --quiet; then
            echo "::error::examples/docs are stale. Run scripts/render-examples.sh"
            echo "and scripts/gen-example-docs.sh, then commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      # Generated workflows are never executed here, so lint them: catches bad
      # YAML, expressions and action inputs in every rendered profile.
      - name: Lint rendered workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -config-file .github/actionlint.yaml examples/rendered/*/.github/workflows/*.yml
