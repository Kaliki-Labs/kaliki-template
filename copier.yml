_subdirectory: template
_templates_suffix: .jinja
_envops:
  keep_trailing_newline: true

# Hidden toggle (never prompted; `when: false`). Set via `-d _skip_tasks=true` to
# render a pure template expansion with no post-generation tasks — used by
# scripts/render-examples.sh to produce the deterministic, committed snapshots in
# examples/rendered/. Full post-task builds are validated separately.
_skip_tasks:
  type: bool
  default: false
  when: false

# Post-generation: run codegen, then resolve the Go module graph so `go.sum`
# exists and the Docker build is reproducible. Requires Go on the host (the
# template targets Go devs). Codegen tools are fetched via `go run`.
# Building the API spec needs Node/npm; the frontend steps need the Flutter SDK
# (which bundles Dart). Those run only when the relevant pieces are generated.
_tasks:
  # Local dev config: server reads backend/config/env.yaml (gitignored). Seed it
  # from the committed example so `go run ./cmd/server` works out of the box.
  - command: "cp config/env.example.yaml config/env.yaml"
    working_directory: "backend"
  # Backend codegen (sqlc, oapi-codegen, go mod tidy) touches only backend/;
  # the API spec build / frontend bootstrap touches only api/,
  # packages/shared_api_client/ and frontend/. The two tracks never read or
  # write the same files, so run them as parallel background jobs and fail if
  # either does — this roughly halves the wall-clock cost of a fresh
  # `copier copy` whenever sqlc/oapi-codegen and the frontend pipeline would
  # otherwise run back-to-back.
  - command: |-
      (
        set -e
        cd backend
      {%- if include_example_domain or auth != 'none' %}
        go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
      {%- endif %}
        for d in gen/api/*/; do
          [ -e "$d/codegen.yaml" ] || continue
          name=$(basename "$d")
          (cd "$d" && go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 --config=codegen.yaml "../../../../api/services/$name.yaml")
        done
        go mod tidy
      ) & backend_pid=$!
      (
        set -e
      {%- if include_frontend %}
        bash scripts/regenerate-api-client.sh
        (
          cd frontend
          flutter create --project-name {{ project_slug | replace('-', '_') }} --org {{ app_bundle_id.rsplit('.', 1)[0] }} .
          rm -f test/widget_test.dart
          perl -i -pe 's{(<application)}{    <uses-permission android:name="android.permission.INTERNET"/>\n$1}' android/app/src/main/AndroidManifest.xml
        )
        # frontend/ and packages/shared_api_client/ are members of one Dart
        # pub workspace (see pubspec.yaml at the project root): `melos
        # bootstrap` resolves both in one shared `.dart_tool/`, then one
        # `--workspace` build_runner invocation generates code for both. This
        # avoids build_runner's ~11-15s builder-pipeline compile cost being
        # paid twice (once per package) on every render.
        dart run melos bootstrap
        dart run build_runner build --workspace --delete-conflicting-outputs
      {%- else %}
        cd api
        npm install
        npm run build:local
      {%- endif %}
      ) & frontend_pid=$!
      wait "$backend_pid"; backend_status=$?
      wait "$frontend_pid"; frontend_status=$?
      [ "$backend_status" -eq 0 ] && [ "$frontend_status" -eq 0 ]
    when: "{{ not _skip_tasks }}"

_message_after_copy: |
  Project "{{ project_name }}" generated.

  Next steps:
    cd {{ project_slug }}
    cp .env.example .env
    docker compose up --build        # backend + postgres + redis{% if auth == 'jwt' %} + mailpit{% endif %}
    curl localhost:8080/health
  {% if auth == 'jwt' %}
  Verification / password-reset emails are captured by Mailpit:
    open http://localhost:8025
  {% endif %}
  Delete the example domain once you've copied its pattern:
    see TEMPLATE_NOTES.md  ->  "Removing the example domain"

# ─── Identity ────────────────────────────────────────────────────────────────
project_name:
  type: str
  help: Human-readable project name
  default: My App

project_slug:
  type: str
  help: Directory / package slug (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

go_module_path:
  type: str
  help: Go module path for the backend (e.g. github.com/org/app/backend)
  default: "github.com/example/{{ project_slug }}/backend"

org_domain:
  type: str
  help: Organization domain (used for bundle ids, image names)
  default: example.com

app_bundle_id:
  type: str
  help: Reverse-DNS bundle id for the Flutter app
  default: "{{ org_domain.split('.') | reverse | join('.') }}.{{ project_slug | replace('-', '') }}"

db_name:
  type: str
  help: Postgres database name
  default: "{{ project_slug | replace('-', '_') }}"

# ─── App composition ─────────────────────────────────────────────────────────
include_frontend:
  type: bool
  help: Generate the primary Flutter app
  default: true

include_example_domain:
  type: bool
  help: "Generate the disposable 'items' example domain (full vertical slice)"
  default: true

# ─── Backend modules ─────────────────────────────────────────────────────────
auth:
  type: str
  help: Authentication module
  choices:
    "None": none
    "JWT (signup + login + verification + password reset)": jwt
  default: jwt

# The mail package is always generated whenever auth is present. Transport is a
# runtime choice via MAIL_PROVIDER (log default locally -> Mailpit; SES in prod),
# not a compile-time flag: the log transport writes credentials to the server log
# and NEVER returns them in the API response, so no config ever leaks tokens.

verification_method:
  type: str
  help: How accounts verify email / reset password
  choices:
    "OTP code (6-digit, mobile-friendly)": otp
    "Token link (URL with embedded token)": token
  default: otp
  when: "{{ auth == 'jwt' }}"

eventing:
  type: str
  help: Event publishing
  choices:
    "None": none
    "Kafka / Redpanda": kafka-redpanda
  default: none

payments:
  type: str
  choices:
    "None": none
    "Razorpay": razorpay
  default: none

push_notifications:
  type: str
  choices:
    "None": none
    "Firebase": firebase
  default: none

object_storage:
  type: str
  choices:
    "None": none
    "S3-compatible": s3
  default: none

# A shared UI design-system package is intentionally NOT scaffolded. The
# frontend ships a handful of local widgets in frontend/lib/widgets; extract a
# real shared_ui package into its own repo once a second app needs it.

# ─── Tooling ─────────────────────────────────────────────────────────────────
# Agent tooling (CLAUDE.md / AGENTS.md / doc-drift / fitness checks) is always
# generated: it's pure markdown + scripts with zero runtime cost, and the
# fitness checks are meant to be strict from commit one.

# observability is intentionally NOT a flag — always generated with a no-op
# exporter by default; configure a real endpoint via config yaml.
